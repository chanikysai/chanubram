<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Bram</title>
  <style>
    :root {
      --color-primary: #6366f1;
      --color-primary-hover: #4f46e5;
      --color-bg: #f9fafb;
      --color-surface: #ffffff;
      --color-border: #e5e7eb;
      --color-text: #111827;
      --color-muted: #6b7280;
      --color-error: #ef4444;
      --color-success: #22c55e;
      --radius: 8px;
      --radius-lg: 12px;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #2b5876, #4e4376);
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      padding: 0;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      box-shadow: 0 1px 8px rgba(32,32,80,0.12);
      max-width: 400px;
      margin: 24px auto;
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2.2rem;
      color: var(--color-primary);
      margin-bottom: 18px;
      margin-top: 0;
    }
    p {
      font-size: 1.08rem;
      max-width: 320px;
      margin: 10px 0 0 0;
      text-align: center;
    }
    button {
      margin-top: 32px;
      padding: 12px 26px;
      font-size: 1.1rem;
      background-color: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 0.5px 2px rgba(68,68,67,0.10);
      outline: none;
    }
    button:hover {
      background-color: var(--color-primary-hover);
    }
    button:active {
      background-color: #3730a3;
    }
    button:focus-visible {
      outline: 2.5px solid var(--color-primary);
      outline-offset: 2px;
    }
    @media (max-width: 600px) {
      .card {
        max-width: 95vw;
        padding: 18px 9px;
      }
      h1 {
        font-size: 1.33rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome, Bram! <span aria-label="smile" role="img">😊</span></h1>
    <p>Thank you for being a beautiful part of my life.<br> <span style="color:var(--color-primary)">Your DOB was submitted & stored successfully!</span></p>
    <p class="subtext">This world is now brighter and even more special &#10084;&#65039;</p>
    <button onclick="window.location.href='special.html'">This is special for you</button>
  </div>
</body>
</html>
